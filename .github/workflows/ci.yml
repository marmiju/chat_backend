name: CI/CD pipeline

on:
    push:
        branches:
          - main
          - authentication
    
    pull_request:
        branches:
          - main
          - authentication


jobs:
    test_and_deploy:
        runs-on: ubuntu-latest


        steps:
            # checkout repository
            - name: checkout code
              uses: actions/checkout@v6
            
            - name: node.js setup
              uses:  actions/setup-node@v4
              with:
                node-version: 20
            
            - name: install dependencies
              run: npm install
            
            - name: run jest tests
              run: npm test
            
            # docker tag based on branch
            - name: set docker tag
              id: docker-tag
              run: |
                if [["${GITHUB_REF##*/}" == "main"]] ; then
                    echo "tag=latest" >> $GITHUB_ENV
                elif [[ "${GITHUB_REF##*/}" == "authentication" ]]; then
                    echo "tag=authentication" >> $GITHUB_ENV
                else
                    echo "tag=unknown" >> $GITHUB_ENV
            
            - name: Build Docker image
              run: docker build -t chat-backend:${{ env.tag }} .
            
            - name: Login to Docker Hub
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
            
            - name: Push Docker image
              run: |
                docker tag chat-backend:${{ env.tag }} ${{ secrets.DOCKER_USERNAME }}/chat-backend:${{ env.tag }}
                docker push ${{ secrets.DOCKER_USERNAME }}/chat-backend:${{ env.tag }}

            


