name: CI/CD pipeline

on:
    push:
        branches:
          - main
          - authentication
          - groups
    
    pull_request:
        branches:
          - main
          - authentication
          - groups

jobs:
  test_and_deploy:
    runs-on: ubuntu-latest
    env:
      MONGO_USER: ${{ secrets.MONGO_USER }}
      MONGO_PASS: ${{ secrets.MONGO_PASS }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
      - name: Print environment variables
        run: |
          echo "NODE_ENV=$NODE_ENV"
          echo "JWT_SECRET=$JWT_SECRET"
          echo "MONGO_USER=$MONGO_USER"
          echo "MONGO_PASS=$MONGO_PASS"


      - name: Run Jest tests
        run: npm test

      - name: Set Docker tag
        id: docker-tag
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"
          if [[ "$BRANCH_NAME" == "main" ]]; then
            echo "tag=latest" >> $GITHUB_ENV
          elif [[ "$BRANCH_NAME" == "authentication" ]]; then
            echo "tag=authentication" >> $GITHUB_ENV
          else
            echo "tag=unknown" >> $GITHUB_ENV
          fi

      - name: Build Docker image
        run: docker build -t chat-backend:${{ env.tag }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker tag chat-backend:${{ env.tag }} ${{ secrets.DOCKER_USERNAME }}/chat-backend:${{ env.tag }}
          docker push ${{ secrets.DOCKER_USERNAME }}/chat-backend:${{ env.tag }}
