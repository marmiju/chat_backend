
services:
  backend:
    build: .
    container_name: chat-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/chatApp_test
    depends_on:
      - mongo
    restart: unless-stopped
  
  mongo:
    container_name: mongo
    image: mongo
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db
    

volumes:
  mongo_data:

