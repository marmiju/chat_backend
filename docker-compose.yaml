
services:
  mongo:
    image: mongo
    container_name: chat-mongo-test
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 1532
    volumes:
      - mongo_test_data:/data/db
  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://admin:1532@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: mongoexpressuser
      ME_CONFIG_BASICAUTH_PASSWORD: mongoexpresspass

  backend:
    build: .
    container_name: chat-backend
    ports:
      - "5000:5000"
    env_file:
      - .env.test
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_test_data:

